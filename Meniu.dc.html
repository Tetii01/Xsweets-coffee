    const from = s.idx, to = from + 1;
    this.setState({ flip: { dir: 'fwd', from, to }, flipRot: 0 });
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ flipRot: -180 })));
    clearTimeout(this._ft);
    this._ft = setTimeout(() => this.setState({ idx: to, flip: null, flipRot: 0 }), 820);
  }

  prev() {
    const s = this.state;
    if (s.flip || s.idx <= 0) return;
    const from = s.idx, to = from - 1;
    this.setState({ flip: { dir: 'bwd', from, to }, flipRot: -180 });
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ flipRot: 0 })));
    clearTimeout(this._ft);
    this._ft = setTimeout(() => this.setState({ idx: to, flip: null, flipRot: 0 }), 820);
  }

  pick(m) {
    clearTimeout(this._ft);
    // always start at the cover of the chosen menu; the reader advances with the arrows
    this.setState({ menu: m, idx: 0, flip: null, flipRot: 0 });
  }

  pageAt(index) {
    if (index === 0) return { cover: true, page: null };
    return { cover: false, page: this.data()[index - 1] };
  }

  componentDidMount() {
    this._key = (e) => { if (e.key === 'ArrowRight') this.next(); else if (e.key === 'ArrowLeft') this.prev(); };
    window.addEventListener('keydown', this._key);
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); clearTimeout(this._ft); }

  renderVals() {
    const s = this.state;
    const flipping = !!s.flip;
    let staticIndex, flipperIndex;
    if (!flipping) { staticIndex = s.idx; flipperIndex = null; }
    else if (s.flip.dir === 'fwd') { staticIndex = s.flip.to; flipperIndex = s.flip.from; }
    else { staticIndex = s.flip.from; flipperIndex = s.flip.to; }

    const st = this.pageAt(staticIndex);
    const fp = flipperIndex != null ? this.pageAt(flipperIndex) : { cover: false, page: null };

    const tabBase = { cursor: 'pointer', border: 'none', fontSize: '12px', letterSpacing: '1.1px', textTransform: 'uppercase', padding: '10px 16px', borderRadius: '40px', transition: 'all .3s ease', whiteSpace: 'nowrap' };
    const tabOn = Object.assign({}, tabBase, { background: '#C41520', color: '#fff' });
    const tabOff = Object.assign({}, tabBase, { background: 'transparent', color: '#B4B2B8' });

    const coverStyle = { width: '100%', height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', background: 'linear-gradient(160deg,#17151a,#0d0c0f)', padding: 'clamp(24px,6%,50px)', gap: '4px', position: 'relative' };

    const atStart = s.idx <= 0 && !flipping;
    const atEnd = s.idx >= this.total() - 1 && !flipping;

    const navBtn = (disabled) => ({
      width: '54px', height: '54px', borderRadius: '50%', cursor: disabled ? 'default' : 'pointer',
      border: '1px solid ' + (disabled ? 'rgba(255,255,255,.08)' : 'rgba(216,50,61,.6)'),
      background: disabled ? 'transparent' : 'rgba(196,21,32,.12)',
      color: disabled ? '#4A484E' : '#F4F4F5', fontSize: '24px', lineHeight: '1', display: 'flex', alignItems: 'center', justifyContent: 'center',
    });

    const label = s.menu === 'drinks' ? 'Băuturi' : (s.menu === 'dessert' ? 'Desert' : 'Mâncare');

    return {
      pickFood: () => this.pick('food'),
      pickDrinks: () => this.pick('drinks'),
      pickDessert: () => this.pick('dessert'),
      foodTabStyle: s.menu === 'food' ? tabOn : tabOff,
      drinksTabStyle: s.menu === 'drinks' ? tabOn : tabOff,
      dessertTabStyle: s.menu === 'dessert' ? tabOn : tabOff,

      staticIsCover: st.cover,
      staticIsContent: !st.cover,
      staticPage: st.page,
      coverStyle,

      flipping,
      flipperIsCover: fp.cover,
      flipperIsContent: flipperIndex != null && !fp.cover,
      flipperPage: fp.page,
      flipperStyle: {
        position: 'absolute', inset: 0, borderRadius: '8px', overflow: 'hidden',
        transformOrigin: 'left center', transform: 'rotateY(' + s.flipRot + 'deg)',
        transition: 'transform .8s cubic-bezier(.42,.02,.28,1)',
        backfaceVisibility: 'hidden', WebkitBackfaceVisibility: 'hidden',
        boxShadow: '0 30px 80px rgba(0,0,0,.6)', border: '1px solid rgba(255,255,255,.06)', zIndex: 6,
      },

      prev: () => this.prev(),
      next: () => this.next(),
      prevCursor: atStart ? 'default' : 'w-resize',
      nextCursor: atEnd ? 'default' : 'e-resize',
      prevBtnStyle: navBtn(atStart),
      nextBtnStyle: navBtn(atEnd),

      pageLabel: s.idx === 0 ? 'Copertă' : s.idx + ' / ' + (this.total() - 1),
      menuLabel: label,
      coverCategory: label,
    };
  }
}
</script>
</body>
</html>
