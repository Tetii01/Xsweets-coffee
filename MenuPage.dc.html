<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ outerRef }}" style="width:100%;height:100%;box-sizing:border-box;background:linear-gradient(160deg,#17151a,#0e0d10);position:relative;overflow:hidden;font-family:'Montserrat',sans-serif">
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 8%, rgba(196,21,32,.10), transparent 55%);pointer-events:none;z-index:0"></div>

  <div ref="{{ innerRef }}" style="{{ innerStyle }}">
    <sc-for list="{{ page.sections }}" as="sec" hint-placeholder-count="2">
      <section style="display:flex;flex-direction:column;gap:11px">
        <div style="display:flex;align-items:baseline;gap:14px">
          <h3 style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.6rem;color:#F6F5F3;margin:0;letter-spacing:.6px;white-space:nowrap">{{ sec.name }}</h3>
          <span style="flex:1;height:1px;background:linear-gradient(90deg,rgba(216,50,61,.7),rgba(216,50,61,.12))"></span>
        </div>
        <sc-for list="{{ sec.items }}" as="it" hint-placeholder-count="4">
          <div style="display:flex;justify-content:space-between;gap:14px;align-items:center">
            <sc-if value="{{ it.img }}" hint-placeholder-val="{{ false }}">
              <img src="{{ it.img }}" alt="{{ it.ro }}" loading="lazy" style="width:118px;height:78px;object-fit:contain;object-position:center;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))">
            </sc-if>
            <div style="flex:1;min-width:0">
              <div style="color:#ECEBE8;font-size:1rem;line-height:1.3;font-weight:500">{{ it.ro }}</div>
              <div style="color:#8C8A90;font-size:.82rem;line-height:1.28;margin-top:2px;font-style:italic">{{ it.sub }}</div>
            </div>
            <div style="color:#D8323D;font-weight:600;white-space:nowrap;font-size:1rem;font-variant-numeric:tabular-nums">{{ it.price }}</div>
          </div>
        </sc-for>
      </section>
    </sc-for>

    <div style="margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:center;gap:12px;opacity:.55">
      <span style="width:26px;height:1px;background:rgba(216,50,61,.5)"></span>
      <span style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.88rem;color:#B4B2B8">X Sweets &amp; Coffee · Păltiniș</span>
      <span style="width:26px;height:1px;background:rgba(216,50,61,.5)"></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:800},&quot;page&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ sections: { name: string; items: { ro: string; sub: string; price: string; img?: string }[] }[] }&quot;}}">
class Component extends DCLogic {
  state = { scale: 1 };

  fit() {
    const o = this._outer, inr = this._inner;
    if (!o || !inr) return;
    const avail = o.clientHeight;
    const need = inr.offsetHeight; // layout height, unaffected by transform
    if (!avail || !need) return;
    let sc = need > avail ? (avail - 6) / need : 1;
    if (sc > 1) sc = 1;
    if (Math.abs(sc - this.state.scale) > 0.004) this.setState({ scale: sc });
  }

  scheduleFit() {
    requestAnimationFrame(() => this.fit());
    clearTimeout(this._t);
    this._t = setTimeout(() => this.fit(), 220);
  }

  componentDidMount() {
    this.scheduleFit();
    this._onResize = () => this.fit();
    window.addEventListener('resize', this._onResize);
    if (window.ResizeObserver && this._outer) {
      this._ro = new ResizeObserver(() => this.fit());
      this._ro.observe(this._outer);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.scheduleFit());
  }

  componentDidUpdate(prevProps) {
    if (prevProps.page !== this.props.page) {
      // new page content — remeasure from scale 1
      this.setState({ scale: 1 }, () => this.scheduleFit());
    }
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    if (this._ro) this._ro.disconnect();
    clearTimeout(this._t);
  }

  renderVals() {
    return {
      page: this.props.page,
      outerRef: (el) => { this._outer = el; },
      innerRef: (el) => { this._inner = el; },
      innerStyle: {
        position: 'relative', zIndex: 1, minHeight: '100%', boxSizing: 'border-box',
        padding: 'clamp(24px,5%,44px) clamp(26px,6.5%,52px)',
        display: 'flex', flexDirection: 'column', gap: '20px',
        transform: 'scale(' + this.state.scale + ')', transformOrigin: 'top center',
      },
    };
  }
}
</script>
</body>
</html>
